on: [push]

jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The World is Mine" > note.txt
      - uses: actions/upload-artifact@v4
        with:
          name: note
          path: note.txt

  two:
    runs-on: ubuntu-latest
    needs: one
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: note
      - run: cat note.txt
